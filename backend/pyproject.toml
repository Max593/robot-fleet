[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-fleet-backend"
version = "0.1.0"
description = "FastAPI backend for the local robot fleet operations MVP."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.3",
    "fastapi>=0.115.0",
    "psycopg[binary]>=3.2.3",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.35",
    "uvicorn[standard]>=0.32.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
