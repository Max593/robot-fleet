[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

sqlalchemy.url = postgresql+psycopg://robot:robot@localhost:5432/robot_fleet

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = [%(created).3f] [%(levelname)s] [%(name)s] %(message)s
