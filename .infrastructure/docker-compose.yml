name: robot-fleet

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: robot_fleet
      POSTGRES_USER: robot
      POSTGRES_PASSWORD: robot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robot -d robot_fleet"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: .infrastructure/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://robot:robot@postgres:5432/robot_fleet
      LOG_LEVEL: INFO
      OFFLINE_AFTER_SECONDS: "45"
      COMMAND_RETENTION_DAYS: "1"
      COMMAND_EXPIRATION_SECONDS: "120"
      EVENT_RETENTION_DAYS: "1"
      DATABASE_POOL_SIZE: "20"
      DATABASE_MAX_OVERFLOW: "30"
      DATABASE_POOL_TIMEOUT: "30"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10

  simulator:
    build:
      context: ..
      dockerfile: .infrastructure/simulator.Dockerfile
    environment:
      BACKEND_BASE_URL: http://backend:8000
      LOG_LEVEL: INFO
      ROBOT_COUNT: "5000"
      HEARTBEAT_INTERVAL_SECONDS: "60"
      MAX_CONCURRENT_REQUESTS: "100"
      DOWNTIME_PROBABILITY: "0.03"
      MIN_DOWNTIME_SECONDS: "60"
      MAX_DOWNTIME_SECONDS: "120"
      SYSTEM_WORK_PROBABILITY: "0.01"
      COMMAND_POLL_INTERVAL_SECONDS: "30"
      COMMAND_EXECUTION_TICK_SECONDS: "5"
      COMMAND_BATTERY_DRAIN_MIN_PERCENT: "2"
      COMMAND_BATTERY_DRAIN_MAX_PERCENT: "5"
      COMMAND_FAILURE_PROBABILITY: "0.03"
      COMMAND_MIN_BATTERY_PERCENT: "10"
      DIAGNOSTIC_DURATION_SECONDS: "20"
      RETURN_TO_BASE_DURATION_SECONDS: "45"
      RECHARGE_TICK_SECONDS: "5"
      RECHARGE_STEP_PERCENT: "10"
      LOW_BATTERY_THRESHOLD_PERCENT: "15"
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: .infrastructure/frontend.Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: robot-fleet-tunnel
    profiles:
      - tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - ./cloudflared.env
      - ./cloudflared-hosts.env
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

volumes:
  postgres_data:
